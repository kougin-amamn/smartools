<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>世界時計 | 世界の都市の現在時刻を一覧表示</title>
    <meta
      name="description"
      content="東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。"
    />
    <meta property="og:title" content="世界時計 | 世界の都市の現在時刻を一覧表示" />
    <meta
      property="og:description"
      content="東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-world-clock.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./world-clock.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "世界時計",
        "alternateName": ["World Clock", "時差", "世界の時刻"],
        "description": "東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-world-clock.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">世界時計<span class="en">World Clock</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <section class="local">
          <div class="local-label">この端末の時刻 <span id="localTz"></span></div>
          <div class="local-time" id="localTime"></div>
          <div class="local-date" id="localDate"></div>
        </section>
        <ul class="list" id="list"></ul>
        <div class="add-row">
          <select id="addSel" aria-label="追加する都市"></select>
          <button class="pill primary" id="addBtn" type="button">追加</button>
        </div>
        <label class="chk"
          ><input type="checkbox" id="h12" data-log="12時間表示" /> 12時間表示(午前/午後)</label
        >
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./world-clock-core.js"></script>
    <script src="./world-clock.js"></script>
  </body>
</html>
