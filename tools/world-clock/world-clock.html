<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>世界時計 | 世界の都市の現在時刻を一覧表示</title>
    <meta
      name="description"
      content="東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。"
    />
    <meta property="og:title" content="世界時計 | 世界の都市の現在時刻を一覧表示" />
    <meta
      property="og:description"
      content="東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-world-clock.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./world-clock.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "世界時計",
        "alternateName": ["World Clock", "時差", "世界の時刻"],
        "description": "東京・ニューヨーク・ロンドンなど世界42都市の現在時刻を一覧で表示する世界時計。時差・昼夜・日付の違いが一目で分かり、サマータイムにも自動対応。端末内で動作します。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-world-clock.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">世界時計<span class="en">World Clock</span></h1>
    </header>
    <main class="content">
      <div class="app">
        <section class="local">
          <div class="local-label">この端末の時刻 <span id="localTz"></span></div>
          <div class="local-time" id="localTime"></div>
          <div class="local-date" id="localDate"></div>
        </section>
        <ul class="list" id="list"></ul>
        <div class="add-row">
          <select id="addSel" aria-label="追加する都市"></select>
          <button class="pill primary" id="addBtn" type="button">追加</button>
        </div>
        <label class="chk"
          ><input type="checkbox" id="h12" data-log="12時間表示" /> 12時間表示(午前/午後)</label
        >
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./world-clock-core.js"></script>
    <script src="./world-clock.js"></script>
  </body>
</html>
