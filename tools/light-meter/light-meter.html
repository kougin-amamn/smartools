<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>照度計 | 周りの明るさを測る</title>
    <meta
      name="description"
      content="周りの明るさを測る照度計です。照度センサーがある端末ではlx(ルクス)で、無い端末ではカメラの映像と露出からlxの目安を表示します(露出情報が取れない端末では相対値)。"
    />
    <meta property="og:title" content="照度計 | 周りの明るさを測る" />
    <meta
      property="og:description"
      content="周りの明るさを測る照度計です。照度センサーがある端末ではlx(ルクス)で、無い端末ではカメラの映像と露出からlxの目安を表示します(露出情報が取れない端末では相対値)。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-light-meter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./light-meter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "照度計",
        "alternateName": ["Light Meter", "ルクス計", "明るさ測定"],
        "description": "周りの明るさを測る照度計です。照度センサーがある端末ではlx(ルクス)で、無い端末ではカメラの映像と露出からlxの目安を表示します(露出情報が取れない端末では相対値)。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-light-meter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">照度計<span class="en">Light Meter</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="lux-num" id="luxNum">--</div>
        <div class="lux-unit" id="luxUnit">%(相対値)</div>
        <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div></div>
        <div class="label" id="labelText">-</div>

        <div class="status" id="statusText">開始ボタンをタップしてください</div>
        <button class="pill primary" id="startStopBtn">開始</button>
        <p class="note" id="noteText"></p>
        <div class="calib" id="calib" hidden>
          <label for="refLux">基準の明るさ(lx)</label>
          <div class="calib-row">
            <input type="number" id="refLux" inputmode="decimal" min="1" step="1" value="500" />
            <button class="mini" id="calBtn">いまの明るさで補正</button>
            <button class="mini" id="calResetBtn">初期値に戻す</button>
          </div>
          <p class="note">
            照度計(別の機器)で測った値を入れて、同じ場所で「補正」を押すと、この端末のカメラに合わせられます。
          </p>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./light-meter-core.js"></script>
    <script src="./light-meter.js"></script>
  </body>
</html>
