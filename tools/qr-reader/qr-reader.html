<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QRコードリーダー | カメラをかざすだけで素早く読み取り</title>
    <meta
      name="description"
      content="カメラをかざすだけでQRコードを読み取れる、シンプルなQRコードリーダーです。読み取った内容のコピーや、URLならそのまま開くこともできます。読み取りは端末の中で行います。"
    />
    <meta property="og:title" content="QRコードリーダー | カメラをかざすだけで素早く読み取り" />
    <meta
      property="og:description"
      content="カメラをかざすだけでQRコードを読み取れる、シンプルなQRコードリーダーです。読み取った内容のコピーや、URLならそのまま開くこともできます。読み取りは端末の中で行います。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-qr-reader.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./qr-reader.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "QRコードリーダー",
        "alternateName": ["QR Code Reader", "QRスキャナー", "QR読み取り"],
        "description": "カメラをかざすだけでQRコードを読み取れる、シンプルなQRコードリーダーです。読み取った内容のコピーや、URLならそのまま開くこともできます。読み取りは端末の中で行います。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-qr-reader.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        QRコードリーダー<span class="en">QR Code Reader</span>
      </h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="scan-frame" data-land-main="fill" id="scanFrame">
          <video id="video" playsinline muted></video>
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line" id="scanLine"></div>
        </div>

        <div class="status" id="statusText">カメラを起動しています…</div>

        <div class="result-card" id="resultCard" hidden>
          <div class="result-label">読み取り結果</div>
          <div class="result-text" id="resultText"></div>
          <div class="result-actions">
            <button class="pill" id="copyBtn">コピー</button>
            <a class="pill link" id="openBtn" href="#" target="_blank" rel="noopener" hidden>開く</a>
            <button class="pill primary" id="rescanBtn">再スキャン</button>
          </div>
        </div>
      </div>
    </main>
    <canvas id="canvas" style="display: none"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./qr-reader.js"></script>
  </body>
</html>
