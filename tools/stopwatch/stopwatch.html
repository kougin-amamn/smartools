<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ストップウォッチ | 1/100秒・ラップ計測</title>
    <meta
      name="description"
      content="1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。"
    />
    <meta property="og:title" content="ストップウォッチ | 1/100秒・ラップ計測" />
    <meta
      property="og:description"
      content="1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-stopwatch.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./stopwatch.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ストップウォッチ",
        "alternateName": ["Stopwatch", "タイム計測", "ラップタイマー"],
        "description": "1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-stopwatch.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        ストップウォッチ<span class="en">Stopwatch</span>
      </h1>
    </header>
    <main class="content">
      <div class="app">
        <div class="time" id="timeText">00:00.00</div>

        <div class="controls">
          <button class="pill" id="lapResetBtn">ラップ</button>
          <button class="pill primary" id="startStopBtn">開始</button>
        </div>

        <div class="laps" id="laps"></div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./stopwatch-core.js"></script>
    <script src="./stopwatch.js"></script>
  </body>
</html>
