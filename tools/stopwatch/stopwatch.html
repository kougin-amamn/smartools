<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ストップウォッチ | 1/100秒・ラップ計測</title>
    <meta
      name="description"
      content="1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。"
    />
    <meta property="og:title" content="ストップウォッチ | 1/100秒・ラップ計測" />
    <meta
      property="og:description"
      content="1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-stopwatch.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./stopwatch.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ストップウォッチ",
        "alternateName": ["Stopwatch", "タイム計測", "ラップタイマー"],
        "description": "1/100秒まで計れるストップウォッチです。ラップ(区間)タイムと合計タイムを記録できます。インストール不要で使えます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-stopwatch.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">ストップウォッチ</h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="ring-wrap" data-land-main="fill">
          <svg viewBox="0 0 220 220" class="ring" aria-hidden="true">
            <circle class="track" cx="110" cy="110" r="100"></circle>
            <circle
              class="progress"
              id="secondRing"
              cx="110"
              cy="110"
              r="100"
              transform="rotate(-90 110 110)"
            ></circle>
            <circle class="head" id="secondHead" cx="110" cy="10" r="7"></circle>
            <circle
              class="pace-track"
              id="paceTrack"
              cx="110"
              cy="110"
              r="84"
              style="display: none"
            ></circle>
            <circle
              class="pace"
              id="paceRing"
              cx="110"
              cy="110"
              r="84"
              transform="rotate(-90 110 110)"
              style="display: none"
            ></circle>
          </svg>
          <div class="time-display">
            <div class="time" id="timeText">00:00<small>.00</small></div>
            <div class="pace-text" id="paceText" hidden></div>
          </div>
        </div>

        <div class="controls">
          <button class="icon-btn secondary" id="resetBtn" aria-label="リセット" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path
                d="M3 12a9 9 0 1 0 3-6.7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3 4v5h5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="icon-btn primary" id="startStopBtn" aria-label="開始">
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none">
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
            </svg>
          </button>
          <button class="icon-btn secondary lap-btn" id="lapBtn" disabled>ラップ</button>
        </div>

        <section class="laps" id="lapsBox" hidden>
          <h2>ラップ</h2>
          <div class="lap-head"><span>番号</span><span>区間</span><span>合計</span></div>
          <div id="laps"></div>
        </section>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./stopwatch-core.js"></script>
    <script src="./stopwatch.js"></script>
  </body>
</html>
