<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>画像ビューア | 回転・拡大・スライドショーで写真を見る</title>
    <meta
      name="description"
      content="端末の写真や画像をまとめて表示できる画像ビューアです。スワイプで切り替え、回転・拡大、全画面表示、スライドショーに対応しています。画像はサーバーに送らず、端末の中だけで表示します。"
    />
    <meta property="og:title" content="画像ビューア | 回転・拡大・スライドショーで写真を見る" />
    <meta
      property="og:description"
      content="端末の写真や画像をまとめて表示できる画像ビューアです。スワイプで切り替え、回転・拡大、全画面表示、スライドショーに対応しています。画像はサーバーに送らず、端末の中だけで表示します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-image-viewer.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./image-viewer.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "画像ビューア",
        "alternateName": ["Image Viewer", "写真ビューア", "フォトビューア"],
        "description": "端末の写真や画像をまとめて表示できる画像ビューアです。スワイプで切り替え、回転・拡大、全画面表示、スライドショーに対応しています。画像はサーバーに送らず、端末の中だけで表示します。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-image-viewer.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        画像ビューア<span class="en">Image Viewer</span>
      </h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <label class="pill small file-label"
          >画像を追加<input
            type="file"
            id="fileInput"
            data-log="画像"
            accept="image/*"
            multiple
            hidden
        /></label>

        <div class="viewer-wrap" data-land-main="fill" id="viewerWrap">
          <img id="mainImg" alt="" draggable="false" />
          <div class="empty-state" id="emptyState">
            <span>画像を追加してください</span>
          </div>
          <button class="nav-btn left" id="prevBtn" aria-label="前へ">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M15 5l-7 7 7 7"
                stroke="#fff"
                stroke-width="2.4"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="nav-btn right" id="nextBtn" aria-label="次へ">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M9 5l7 7-7 7"
                stroke="#fff"
                stroke-width="2.4"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="exit-fs-btn" id="exitFsBtn" aria-label="全画面解除" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="#fff"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <div class="counter" id="counterText"></div>
        </div>

        <div class="controls-row">
          <button class="round" id="rotateBtn" aria-label="回転">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M3 12a9 9 0 1 0 3-6.7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3 4v5h5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="round" id="slideshowBtn" aria-label="スライドショー">
            <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" width="18" height="18" style="display: none">
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
            </svg>
          </button>
          <input type="range" id="zoomSlider" data-log="拡大" min="100" max="400" value="100" />
          <button class="round" id="fullscreenBtn" aria-label="全画面">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div class="thumb-strip" id="thumbStrip"></div>
        <div class="status" id="statusText">
          端末内の画像を追加してください(サーバーには送信されません)
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./image-viewer.js"></script>
  </body>
</html>
