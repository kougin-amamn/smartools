<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>メモ帳 | 端末に自動保存されるシンプルなメモ</title>
    <meta
      name="description"
      content="書いた内容が自動で端末に保存される、シンプルなメモ帳です。複数のメモを一覧で管理でき、最初の行がタイトルになります。データはサーバーに送らず、端末の中だけに保存されます。"
    />
    <meta property="og:title" content="メモ帳 | 端末に自動保存されるシンプルなメモ" />
    <meta
      property="og:description"
      content="書いた内容が自動で端末に保存される、シンプルなメモ帳です。複数のメモを一覧で管理でき、最初の行がタイトルになります。データはサーバーに送らず、端末の中だけに保存されます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-notepad.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./notepad.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "メモ帳",
        "alternateName": ["Notepad", "メモ", "Memo"],
        "description": "書いた内容が自動で端末に保存される、シンプルなメモ帳です。複数のメモを一覧で管理でき、最初の行がタイトルになります。データはサーバーに送らず、端末の中だけに保存されます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-notepad.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">メモ帳<span class="en">Notepad</span></h1>
    </header>
    <main class="content">
      <div class="app">
        <div class="list-view" id="listView">
          <button class="pill primary" id="newBtn">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
            新規メモ
          </button>
          <div class="note-list" id="noteList"></div>
          <div class="status" id="statusText">メモがありません</div>
        </div>

        <div class="editor-view" id="editorView" hidden>
          <div class="editor-bar">
            <button class="icon-btn" id="backBtn" aria-label="一覧へ戻る">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M15 5l-7 7 7 7"
                  stroke="currentColor"
                  stroke-width="2.2"
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <span class="saved-label" id="savedLabel"></span>
            <button class="icon-btn" id="deleteBtn" aria-label="削除">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <textarea id="noteText" placeholder="メモを入力してください"></textarea>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./notepad.js"></script>
  </body>
</html>
