<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>騒音計 | マイクで音の大きさを測る</title>
    <meta
      name="description"
      content="マイクで周りの音の大きさを測り、今の値と最小・平均・最大を表示する騒音計です。校正していないため、実際のdBとは異なる目安の値です。音声は録音も送信もしません。"
    />
    <meta property="og:title" content="騒音計 | マイクで音の大きさを測る" />
    <meta
      property="og:description"
      content="マイクで周りの音の大きさを測り、今の値と最小・平均・最大を表示する騒音計です。校正していないため、実際のdBとは異なる目安の値です。音声は録音も送信もしません。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-noise-meter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./noise-meter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "騒音計",
        "alternateName": ["Noise Meter", "デシベル計", "騒音測定"],
        "description": "マイクで周りの音の大きさを測り、今の値と最小・平均・最大を表示する騒音計です。校正していないため、実際のdBとは異なる目安の値です。音声は録音も送信もしません。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-noise-meter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">騒音計<span class="en">Noise Meter</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="db-num" id="dbNum">--</div>
        <div class="db-unit">dB(参考値)</div>

        <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div></div>

        <div class="grid">
          <div class="stat">
            <div class="stat-label">最小</div>
            <div class="stat-val" id="minVal">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">平均</div>
            <div class="stat-val" id="avgVal">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">最大</div>
            <div class="stat-val" id="maxVal">--</div>
          </div>
        </div>

        <div class="status" id="statusText">開始ボタンをタップしてください</div>
        <div class="controls">
          <button class="pill" id="resetBtn">リセット</button>
          <button class="pill primary" id="startStopBtn">開始</button>
        </div>
        <p class="note">
          マイクの機種や環境で値が変わるため、正確な騒音測定器としての値ではありません。目安としてご利用ください。
        </p>
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./noise-meter-core.js"></script>
    <script src="./noise-meter.js"></script>
  </body>
</html>
