    <meta
      name="description"
      content="ターンテーブル風の音楽プレーヤー。端末の音楽ファイルをレコード盤にのせて再生し、指で盤を回してスクラッチ、33/45回転やピッチの調整もできます。曲は端末内で処理され送信されません。"
    />

    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./dj-turntable.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DJターンテーブル",
        "alternateName": ["DJ Turntable", "ターンテーブル", "レコードプレーヤー", "スクラッチ"],
        "description": "ターンテーブル風の音楽プレーヤー。端末の音楽ファイルをレコード盤にのせて再生し、指で盤を回してスクラッチ、33/45回転やピッチの調整もできます。曲は端末内で処理され送信されません。",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
      }

                fill="#0b2b27"

                font-family="sans-serif"

              <circle cx="165" cy="204" r="3" fill="#0b2b27" fill-opacity="0.55" />

            </g>
            <circle id="hit" cx="165" cy="165" r="138" fill="transparent" />

              <line
                x1="-34"
                y1="0"
                x2="193"
                y2="0"
                stroke-width="5"
                stroke-linecap="round"
                style="stroke: var(--arm)"
              />
              <rect x="-46" y="-7" width="16" height="14" rx="3" style="fill: var(--arm-dark)" />

        </div>

        <div class="now">
          <span class="title" id="trackTitle">曲を選んでください</span
          ><span class="time" id="timeText">00:00 / 00:00</span>
        </div>
        <div class="wave" id="waveBox" aria-label="再生位置(押すとそこから再生)">
          <canvas id="wave"></canvas>
          <div class="played" id="played"></div>
          <div class="head" id="head"></div>
        </div>
        <div class="status" id="status" role="status"></div>

        <div class="transport">
          <button class="round" id="prevBtn" aria-label="前の曲" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 5h2v14H6zM20 5v14L9 12z" />
            </svg>
          </button>
          <button class="round" id="cueBtn" aria-label="頭出し">
            <span class="cue-txt">CUE</span>
          </button>
          <button class="round big" id="playBtn" aria-label="再生" aria-pressed="false">
            <svg class="i-play" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
            </svg>
          </button>
          <button class="round" id="nextBtn" aria-label="次の曲" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
            </svg>
          </button>
        </div>

        <div class="panel">
          <div class="opt">
            <div class="lbl">回転数</div>
            <div class="seg" role="group" aria-label="回転数" data-log-group="回転数">
              <button type="button" class="seg-btn on" data-rpm="33.3333" data-log="33回転">
                33⅓ 回転
              </button>
              <button type="button" class="seg-btn" data-rpm="45" data-log="45回転">45 回転</button>
            </div>
          </div>
          <div class="opt">
            <label for="pitch">ピッチ(速さの微調整)</label>
            <div class="row">
              <input
                type="range"
                id="pitch"
                min="-8"
                max="8"
                step="0.1"
                value="0"
                data-log="ピッチ"
              /><output id="pitchVal">0.0%</output
              ><button type="button" class="mini" id="pitchReset" aria-label="ピッチを0に戻す">
                0
              </button>
            </div>
          </div>
          <div class="opt">
            <label for="volume">音量</label>
            <div class="row">
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                data-log="音量"
              />
            </div>
          </div>
        </div>

        <div class="list-head">
          <h2>曲リスト</h2>
          <label class="pill"
            >曲を追加<input
              type="file"
              id="fileInput"
              accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus"
              multiple
              hidden
              data-log="曲を追加"
          /></label>
        </div>
        <ul class="tracks" id="tracks"></ul>

        <div class="note">
          曲は端末の中だけで処理し、送信しません。盤を指で回すとスクラッチ(逆に回せば逆再生)、回転数やピッチで速さと音の高さが変わります。長い曲は読み込みに時間がかかり、メモリも使います。
        </div>
      </div>

        );
    </script>
