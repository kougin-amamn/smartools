<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>心拍数計 | カメラに指を当てて脈拍を測る</title>
    <meta
      name="description"
      content="スマホの背面カメラとライトを指先でふさぐだけで心拍数(脈拍)を測るアプリです。指先の血液の量の変化をカメラで読み取り、脈の波形と1分あたりの心拍数を表示して、測った記録も残せます。"
    />
    <meta property="og:title" content="心拍数計 | カメラに指を当てて脈拍を測る" />
    <meta
      property="og:description"
      content="スマホの背面カメラとライトを指先でふさぐだけで心拍数(脈拍)を測るアプリです。指先の血液の量の変化をカメラで読み取り、脈の波形と1分あたりの心拍数を表示して、測った記録も残せます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-heart-rate.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./heart-rate.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "心拍数計",
        "alternateName": ["Heart Rate Monitor", "脈拍計", "心拍計", "脈拍測定"],
        "description": "スマホの背面カメラとライトを指先でふさぐだけで心拍数(脈拍)を測るアプリです。指先の血液の量の変化をカメラで読み取り、脈の波形と1分あたりの心拍数を表示して、測った記録も残せます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-heart-rate.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">心拍数計<span class="en">Heart Rate Monitor</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="meter" data-land-main>
          <div class="cam"><video id="video" playsinline muted></video></div>
          <div class="read">
            <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6.9-1.5 2.6-2.6 4.6-2.6 3.4 0 5.4 3.4 4 6.7C19.5 16.4 12 21 12 21z"
                fill="currentColor"
              />
            </svg>
            <div class="bpm"><span id="bpm">--</span><small>bpm</small></div>
          </div>
        </div>
        <div class="status" id="status">背面のカメラとライトを、人差し指の腹でそっとふさいでください</div>
        <div class="progress"><i id="bar"></i></div>
        <canvas id="wave" class="wave" width="680" height="160" aria-label="脈の波形"></canvas>
        <button class="pill primary big" id="startBtn">測定を始める</button>
        <div class="history">
          <div class="h-title">測った記録</div>
          <ul id="history" data-log="off"></ul>
          <button class="pill small" id="clearBtn" hidden>記録を消す</button>
        </div>
        <p class="note">
          医療機器ではありません。目安としてお使いください。指を強く押し付けると血の流れが止まって測れません。体調が気になる時は医療機関で測ってください。
        </p>
        <canvas id="sample" width="32" height="32" hidden></canvas>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./heart-rate-core.js"></script>
    <script src="./heart-rate.js"></script>
  </body>
</html>
