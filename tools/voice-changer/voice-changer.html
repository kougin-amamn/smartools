<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ボイスチェンジャー | リアルタイムで声を加工して録音</title>
    <meta
      name="description"
      content="マイクの声をロボット・ラジオ・メガホン・エコー・ヘリウム風・オバケ風にリアルタイムで加工するボイスチェンジャーです。加工した声の録音と保存にも対応しています。"
    />
    <meta property="og:title" content="ボイスチェンジャー | リアルタイムで声を加工して録音" />
    <meta
      property="og:description"
      content="マイクの声をロボット・ラジオ・メガホン・エコー・ヘリウム風・オバケ風にリアルタイムで加工するボイスチェンジャーです。加工した声の録音と保存にも対応しています。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-voice-changer.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./voice-changer.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ボイスチェンジャー",
        "alternateName": ["Voice Changer", "声変換", "ボイチェン"],
        "description": "マイクの声をロボット・ラジオ・メガホン・エコー・ヘリウム風・オバケ風にリアルタイムで加工するボイスチェンジャーです。加工した声の録音と保存にも対応しています。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-voice-changer.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        ボイスチェンジャー<span class="en">Voice Changer</span>
      </h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <button class="pill primary" id="startBtn">マイクを開始</button>
        <div class="status" id="statusText">開始ボタンを押すとマイクの許可を求めます</div>

        <div class="panel" id="panel" hidden>
          <div class="modes" id="modes">
            <button class="mode on" data-mode="normal">通常</button>
            <button class="mode" data-mode="robot">ロボット</button>
            <button class="mode" data-mode="radio">ラジオ</button>
            <button class="mode" data-mode="megaphone">メガホン</button>
            <button class="mode" data-mode="echo">エコー</button>
            <button class="mode" data-mode="helium">ヘリウム風</button>
            <button class="mode" data-mode="ghost">オバケ風</button>
          </div>

          <label class="row"
            ><input type="checkbox" id="monitorChk" data-log="モニター(スピーカーで聞く)" />
            モニター音を聞く(ハウリング防止のためヘッドホン推奨)</label
          >
          <div class="row">
            <span>出力音量</span>
            <input
              type="range"
              id="volumeSlider"
              data-log="音量"
              data-log-scale="100"
              data-log-unit="%"
              min="0"
              max="1.5"
              step="0.01"
              value="1"
            />
          </div>

          <div class="rec-row">
            <button class="pill" id="recBtn">● 録音開始</button>
            <span class="rec-time" id="recTime"></span>
          </div>
          <div class="recordings" id="recordings" data-log="off"></div>
        </div>
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./voice-changer.js"></script>
  </body>
</html>
