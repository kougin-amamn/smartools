<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>エフェクトカメラ | サーモ風・チルト・VHS・残像・スリットスキャンのカメラ</title>
    <meta
      name="description"
      content="カメラの映像を、サーモグラフィ風・チルトシフト(ミニチュア風)・VHS(ビデオテープ風)・ブラウン管・残像・スリットスキャン・動いた所に色・グリッチに加工して映すカメラです。色温度を変えたり、映像を止めて撮影・保存したりできます。"
    />
    <meta
      property="og:title"
      content="エフェクトカメラ | サーモ風・チルト・VHS・残像・スリットスキャンのカメラ"
    />
    <meta
      property="og:description"
      content="カメラの映像を、サーモグラフィ風・チルトシフト(ミニチュア風)・VHS(ビデオテープ風)・ブラウン管・残像・スリットスキャン・動いた所に色・グリッチに加工して映すカメラです。色温度を変えたり、映像を止めて撮影・保存したりできます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-effect-camera.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./effect-camera.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "エフェクトカメラ",
        "alternateName": [
          "Effect Camera",
          "サーモグラフィカメラ風",
          "チルトシフト",
          "ミニチュア風",
          "VHS風カメラ",
          "残像カメラ",
          "スリットスキャン",
          "グリッチ",
          "ブラウン管"
        ],
        "description": "カメラの映像を、サーモグラフィ風・チルトシフト(ミニチュア風)・VHS(ビデオテープ風)・ブラウン管・残像・スリットスキャン・動いた所に色・グリッチに加工して映すカメラです。色温度を変えたり、映像を止めて撮影・保存したりできます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-effect-camera.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">エフェクトカメラ<span class="en">Effect Camera</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="cam-wrap" data-land-main="fill" id="camWrap">
          <canvas id="view" aria-label="加工した映像"></canvas>
          <video id="video" class="src" playsinline muted></video>
          <div class="vhs-osd" id="vhsOsd" hidden aria-hidden="true">
            <span class="play">PLAY ▶</span><span class="tm" id="vhsTime"></span>
          </div>
          <div class="empty-state" id="emptyState">
            <svg
              viewBox="0 0 24 24"
              width="36"
              height="36"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M4 7h4l2-2h4l2 2h4v12H4z" stroke-linejoin="round" />
              <circle cx="12" cy="13" r="3.4" />
            </svg>
            <span id="statusText">カメラを起動しています…</span>
          </div>
        </div>

        <div class="controls-row">
          <button class="round" id="switchCamBtn" aria-label="カメラ切替">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 7h4l2-2h4l2 2h4v12H4z" />
              <circle cx="12" cy="13" r="3.4" />
              <path d="M19 5l2 2-2 2M5 19l-2-2 2-2" />
            </svg>
          </button>
          <button class="round" id="freezeBtn" aria-label="映像の静止" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          </button>
          <button class="round big" id="captureBtn" aria-label="撮影"></button>
        </div>
        <div class="mode-row" id="modeRow" data-log-group="効果"></div>

        <div class="sliders">
          <div id="params"></div>
          <div class="slider-row">
            <span>色温度</span>
            <input
              type="range"
              id="kelvin"
              aria-label="色温度"
              data-log-value="#kelvinVal"
              min="2000"
              max="12000"
              step="100"
              value="6500"
            />
            <b id="kelvinVal">6500K</b>
          </div>
          <div class="row-end">
            <button class="pill small" id="kelvinReset" data-log="色温度を戻す">色温度を戻す</button>
          </div>
        </div>

        <div class="captured-list" id="capturedList" data-log="off"></div>
        <p class="note">
          サーモ風は明るさを色に置き換えた表現で、温度は測れません。魚眼と拡大鏡はレンズカメラにあります。
        </p>
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./effect-camera-core.js"></script>
    <script src="./effect-camera-shaders.js"></script>
    <script src="./effect-camera.js"></script>
  </body>
</html>
