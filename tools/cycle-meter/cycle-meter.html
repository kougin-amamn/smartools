<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>サイクルメーター | GPSで速度・距離・時間を計測</title>
    <meta
      name="description"
      content="GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。"
    />
    <meta property="og:title" content="サイクルメーター | GPSで速度・距離・時間を計測" />
    <meta
      property="og:description"
      content="GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-cycle-meter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./cycle-meter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "サイクルメーター",
        "alternateName": ["Cycle Meter", "サイクルコンピューター", "速度計"],
        "description": "GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-cycle-meter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        サイクルメーター<span class="en">Cycle Meter</span>
      </h1>
    </header>
    <main class="content">
      <div class="app">
        <div class="speed-num" id="speedNum">0.0</div>
        <div class="speed-unit">km/h</div>

        <div class="grid">
          <div class="stat">
            <div class="stat-label">距離</div>
            <div class="stat-val" id="distVal">0.00 km</div>
          </div>
          <div class="stat">
            <div class="stat-label">経過時間</div>
            <div class="stat-val" id="timeVal">00:00</div>
          </div>
          <div class="stat">
            <div class="stat-label">平均速度</div>
            <div class="stat-val" id="avgVal">0.0 km/h</div>
          </div>
          <div class="stat">
            <div class="stat-label">最高速度</div>
            <div class="stat-val" id="maxVal">0.0 km/h</div>
          </div>
        </div>

        <div class="status" id="statusText">開始ボタンをタップしてください</div>

        <div class="controls">
          <button class="pill" id="resetBtn">リセット</button>
          <button class="pill primary" id="startStopBtn">開始</button>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./cycle-meter-core.js"></script>
    <script src="./cycle-meter.js"></script>
  </body>
</html>
