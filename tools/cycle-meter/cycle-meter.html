<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>サイクルメーター | GPSで速度・距離・時間を計測</title>
    <meta
      name="description"
      content="GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。"
    />
    <meta property="og:title" content="サイクルメーター | GPSで速度・距離・時間を計測" />
    <meta
      property="og:description"
      content="GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-cycle-meter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./cycle-meter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "サイクルメーター",
        "alternateName": ["Cycle Meter", "サイクルコンピューター", "速度計"],
        "description": "GPSで自転車の速度・走行距離・時間・平均速度・最高速度を計測するサイクルメーターです。位置の記録はサーバーに送らず、端末の中だけで計算します。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-cycle-meter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">サイクルメーター<span class="en">Cycle Meter</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="speed-num" id="speedNum">0.0</div>
        <div class="speed-unit">km/h</div>

        <div class="grid">
          <div class="stat">
            <div class="stat-label">距離</div>
            <div class="stat-val" id="distVal">0.00 km</div>
          </div>
          <div class="stat">
            <div class="stat-label">経過時間</div>
            <div class="stat-val" id="timeVal">00:00</div>
          </div>
          <div class="stat">
            <div class="stat-label">平均速度</div>
            <div class="stat-val" id="avgVal">0.0 km/h</div>
          </div>
          <div class="stat">
            <div class="stat-label">最高速度</div>
            <div class="stat-val" id="maxVal">0.0 km/h</div>
          </div>
        </div>

        <div class="status" id="statusText">開始ボタンをタップしてください</div>

        <div class="controls">
          <button class="pill" id="resetBtn">リセット</button>
          <button class="pill primary" id="startStopBtn">開始</button>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./cycle-meter-core.js"></script>
    <script src="./cycle-meter.js"></script>
  </body>
</html>
