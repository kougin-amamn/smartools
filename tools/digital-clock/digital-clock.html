<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>デジタル時計 | 表示形式・色・フォント・フレームを選べる時計</title>
    <meta
      name="description"
      content="デジタル時計を全画面に近い大きさで表示。表示形式(24時間・12時間・日付つきなど)、文字色、フォント、文字サイズ、背景色、フレームを自由に選べ、設定は端末に保存されます。"
    />
    <meta property="og:title" content="デジタル時計 | 表示形式・色・フォント・フレームを選べる時計" />
    <meta
      property="og:description"
      content="デジタル時計を全画面に近い大きさで表示。表示形式(24時間・12時間・日付つきなど)、文字色、フォント、文字サイズ、背景色、フレームを自由に選べ、設定は端末に保存されます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-digital-clock.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./digital-clock.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "デジタル時計",
        "alternateName": ["Digital Clock", "時計", "置き時計"],
        "description": "デジタル時計を全画面に近い大きさで表示。表示形式(24時間・12時間・日付つきなど)、文字色、フォント、文字サイズ、背景色、フレームを自由に選べ、設定は端末に保存されます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-digital-clock.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">デジタル時計<span class="en">Digital Clock</span></h1>
      <button class="dbg-btn" id="setBtn" aria-label="設定" title="設定">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="screen-wrap">
          <div class="screen" id="screen" role="timer" aria-label="現在時刻">
            <div class="clock" id="clock"></div>
          </div>
        </div>
        <div class="warn" id="warn"></div>
      </div>
    </main>
    <div class="sheet" id="settings" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-head">
          <span id="settingsTitle">設定</span
          ><button class="sheet-close" id="settingsClose" aria-label="設定を閉じる">×</button>
        </div>
        <div class="panel">
          <div class="opt">
            <label for="format">表示形式</label
            ><select id="format" data-log="表示形式"></select>
          </div>
          <div class="opt">
            <div class="lbl">文字色</div>
            <div class="swatches" id="colorSw"></div>
          </div>
          <div class="opt">
            <label for="font">文字フォント</label
            ><select id="font" data-log="文字フォント"></select>
          </div>
          <div class="opt">
            <label for="size">文字サイズ</label>
            <div class="size-row">
              <input type="range" id="size" step="5" data-log="文字サイズ" data-log-unit="%" /><span
                id="sizeVal"
              ></span>
            </div>
          </div>
          <div class="opt">
            <div class="lbl">背景色</div>
            <div class="swatches" id="bgSw"></div>
          </div>
          <div class="opt">
            <label for="frame">フレーム</label
            ><select id="frame" data-log="フレーム"></select>
          </div>
        </div>

        <button class="pill" id="resetBtn" data-log="初期設定に戻す">初期設定に戻す</button>
      </div>
    </div>
    <script src="../../common/log.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./digital-clock-core.js"></script>
    <script src="./digital-clock.js"></script>
  </body>
</html>
