<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>アナログ時計 | ローマ数字・干支・旧漢数字も選べる時計</title>
    <meta
      name="description"
      content="アナログ時計。文字(ローマ数字・旧漢数字・干支・数字)、文字の向き、サイズ、フォント、色と効果、フレームと幅を選べ、おすすめテンプレートでまとめて切り替えられます。"
    />
    <meta property="og:title" content="アナログ時計 | ローマ数字・干支・旧漢数字も選べる時計" />
    <meta
      property="og:description"
      content="アナログ時計。文字(ローマ数字・旧漢数字・干支・数字)、文字の向き、サイズ、フォント、色と効果、フレームと幅を選べ、おすすめテンプレートでまとめて切り替えられます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-analog-clock.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./analog-clock.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "アナログ時計",
        "alternateName": ["Analog Clock", "時計"],
        "description": "アナログ時計。文字(ローマ数字・旧漢数字・干支・数字)、文字の向き、サイズ、フォント、色と効果、フレームと幅を選べ、おすすめテンプレートでまとめて切り替えられます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-analog-clock.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">アナログ時計<span class="en">Analog Clock</span></h1>
      <button class="dbg-btn" id="setBtn" aria-label="設定" title="設定">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="clock-wrap">
          <svg id="clockSvg" viewBox="0 0 200 200" role="img" aria-label="現在時刻のアナログ時計"></svg>
        </div>
      </div>
    </main>
    <div class="sheet" id="settings" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-head">
          <span id="settingsTitle">設定</span
          ><button class="sheet-close" id="settingsClose" aria-label="設定を閉じる">×</button>
        </div>
        <div class="panel-title">おすすめテンプレート</div>
        <div class="tpl-list" id="tplList"></div>

        <div class="panel-title">詳細設定</div>
        <div class="panel">
          <div class="opt">
            <label for="chars">文字</label
            ><select id="chars" data-log="文字"></select>
          </div>
          <div class="opt">
            <div class="lbl">文字の向き</div>
            <div class="seg" id="orientSeg" role="group" aria-label="文字の向き"></div>
          </div>
          <div class="opt">
            <label for="size">文字サイズ</label>
            <div class="size-row">
              <input type="range" id="size" step="5" data-log="文字サイズ" data-log-unit="%" /><span
                id="sizeVal"
              ></span>
            </div>
          </div>
          <div class="opt">
            <label for="font">文字フォント</label
            ><select id="font" data-log="文字フォント"></select>
          </div>
          <div class="opt">
            <div class="lbl">文字色</div>
            <div class="swatches" id="colorSw"></div>
          </div>
          <div class="opt">
            <label for="effect">文字の効果</label
            ><select id="effect" data-log="文字の効果"></select>
          </div>
          <div class="opt">
            <label for="frame">フレーム</label
            ><select id="frame" data-log="フレーム"></select>
          </div>
          <div class="opt" id="fwidthRow">
            <label for="fwidth">フレーム幅</label>
            <div class="size-row">
              <input type="range" id="fwidth" step="1" data-log="フレーム幅" /><span id="fwidthVal"></span>
            </div>
          </div>
        </div>

        <button class="pill" id="resetBtn" data-log="初期設定に戻す">初期設定に戻す</button>
      </div>
    </div>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./analog-clock-core.js"></script>
    <script src="./analog-clock.js"></script>
  </body>
</html>
