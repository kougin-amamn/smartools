<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>万歩計 | モーションセンサーで歩数をカウント</title>
    <meta
      name="description"
      content="万歩計(歩数計・pedometer)は、端末のモーションセンサーで歩数を数え、距離とカロリーの目安も表示します。画面が自動で消えないようにするスリープ防止付きです。"
    />
    <meta property="og:title" content="万歩計 | モーションセンサーで歩数をカウント" />
    <meta
      property="og:description"
      content="万歩計(歩数計・pedometer)は、端末のモーションセンサーで歩数を数え、距離とカロリーの目安も表示します。画面が自動で消えないようにするスリープ防止付きです。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-step-counter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./step-counter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "万歩計",
        "alternateName": ["Step Counter", "歩数計", "Pedometer"],
        "description": "万歩計(歩数計・pedometer)は、端末のモーションセンサーで歩数を数え、距離とカロリーの目安も表示します。画面が自動で消えないようにするスリープ防止付きです。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-step-counter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">万歩計<span class="en">Step Counter</span></h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="count-ring" data-land-main>
          <div class="count-val" id="countVal">0</div>
          <div class="count-label">歩</div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">歩幅換算の距離</span><span class="val" id="distVal">0.0 km</span>
          </div>
          <div class="stat">
            <span class="label">消費カロリー目安</span><span class="val" id="calVal">0 kcal</span>
          </div>
        </div>

        <button class="pill primary" id="startBtn">計測開始</button>
        <button class="pill" id="stopBtn" hidden>計測停止</button>
        <label class="row chk"
          ><input type="checkbox" id="wakeLockChk" data-log="スリープ防止" />
          計測中は画面を消灯させない</label
        >
        <button class="pill small" id="resetBtn">歩数をリセット</button>

        <div class="status" id="statusText"></div>

        <p class="note">
          端末のモーションセンサー(加速度)を使い、合成加速度の変化からピークを検出して歩数を数える簡易的な方式です。歩数計専用機ほどの精度はありません。iPhoneでは初回にモーションセンサーの利用許可が必要です。<br />
          距離・カロリーは一般的な歩幅(約70cm)・消費量(体重60kg想定)を仮定した概算です。<br />
          「画面を消灯させない」はWake Lock APIを使っています。対応していないブラウザでは効果がありません。
        </p>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./step-counter-core.js"></script>
    <script src="./step-counter.js"></script>
  </body>
</html>
