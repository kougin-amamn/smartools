<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>水平器 | スマホを置くだけで傾きを確認</title>
    <meta
      name="description"
      content="スマホの傾きセンサーで、前後・左右の傾きを泡と角度で表示する水平器です。水平になると泡の色が変わり、対応端末では振動でも知らせます。"
    />
    <meta property="og:title" content="水平器 | スマホを置くだけで傾きを確認" />
    <meta
      property="og:description"
      content="スマホの傾きセンサーで、前後・左右の傾きを泡と角度で表示する水平器です。水平になると泡の色が変わり、対応端末では振動でも知らせます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-level.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./level.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "水平器",
        "alternateName": ["Level", "水準器", "傾き測定"],
        "description": "スマホの傾きセンサーで、前後・左右の傾きを泡と角度で表示する水平器です。水平になると泡の色が変わり、対応端末では振動でも知らせます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-level.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">水平器<span class="en">Level</span></h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="level-outer" data-land-main id="levelOuter">
          <div class="crosshair"></div>
          <div class="bubble" id="bubble"></div>
        </div>

        <div class="angles" id="angles">前後 --° / 左右 --°</div>
        <div class="status" id="statusText">開始ボタンをタップしてください</div>
        <button class="pill primary" id="startBtn">水平器を開始</button>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./level.js"></script>
  </body>
</html>
