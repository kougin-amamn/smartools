<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>高度計 | Smartools</title><meta name="description" content="GPS高度と基準地点からの高度差を確認する高度計"><link rel="stylesheet" href="../../common/site.css"><link rel="stylesheet" href="../../common/tool.css"><link rel="stylesheet" href="./altimeter.css"></head><body><header class="site-bar"><h1>高度計</h1></header><main class="content"><section class="alt-app"><div class="modes" role="group" aria-label="測定用途"><button id="outdoor" class="selected" aria-pressed="true">屋外</button><button id="indoor" aria-pressed="false">屋内</button></div><div class="reading"><p id="readingLabel">GPS高度（楕円体高）</p><div><output id="altitude">—</output><span class="unit">m</span></div><p id="quality" role="status">位置情報を待っています</p></div><div class="stats"><div><small>高度精度</small><strong id="accuracy">—</strong></div><div><small>基準からの高度差</small><strong id="difference">—</strong></div></div><div class="actions"><button id="baseline" disabled>現在地を基準にする</button><button id="retry" hidden>再試行</button></div><section class="chart-panel"><div class="chart-head"><span>高度の推移</span><small>直近5分</small></div><canvas id="chart" height="120" aria-label="GPS高度の推移" role="img"></canvas></section><details><summary>設定・測定について</summary><label>基準高度（m）<input id="baseInput" type="number" step="0.1" placeholder="手動で入力"></label><button id="setBase">基準高度を設定</button><button id="clearBase">基準を解除</button><p>GPS高度は海抜とは異なる楕円体高の場合があります。屋内ではGPSが不安定で、階数や小さな上下移動を正確に判定できません。位置座標は送信・保存しません。</p></details></section></main><script src="../../common/log.js"></script><script src="../../common/env.js"></script><script src="../../common/site.js"></script><script src="../../common/tool-kit.js"></script><script src="./altimeter.js"></script></body></html>
