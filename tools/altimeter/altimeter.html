<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>高度計 | 標高と高度差が分かる高度計</title>
    <meta
      name="description"
      content="今いる場所の標高(海抜)と、GPS の高さで基準の地点からどれだけ上り下りしたかを見られる高度計。"
    />
    <meta property="og:title" content="高度計 | 標高と高度差が分かる高度計" />
    <meta
      property="og:description"
      content="今いる場所の標高(海抜)と、GPS の高さで基準の地点からどれだけ上り下りしたかを見られる高度計。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-altimeter.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./altimeter.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "高度計",
        "alternateName": ["Altimeter", "標高計", "高度"],
        "description": "今いる場所の標高(海抜)と、GPS の高さで基準の地点からどれだけ上り下りしたかを見られる高度計。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-altimeter.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">高度計</h1>
    </header>
    <main class="content">
      <div class="app">
        <div class="reading">
          <div class="reading-label">標高(海抜)</div>
          <div class="reading-value">
            <output id="elevation">—</output><span class="unit">m</span>
          </div>
          <div class="reading-source">地面の高さ(地図のデータ)</div>
        </div>

        <div class="actions">
          <button class="pill primary" id="startBtn" hidden>位置情報を許可</button>
          <button class="pill primary" id="baseBtn" hidden>ここを基準にする</button>
          <button class="pill" id="clearBtn" hidden>基準を解除</button>
        </div>

        <div class="cards">
          <div class="card-box">
            <div class="card-title">基準からの差</div>
            <div class="card-value" id="difference">—</div>
            <div class="card-sub" id="differenceSub">基準を決めると出ます</div>
          </div>
          <div class="card-box">
            <div class="card-title">GPS の高さ</div>
            <div class="card-value" id="gpsHeight">—</div>
            <div class="card-sub">
              <span id="accuracy">精度 —</span
              ><span class="mark" id="qualityMark" hidden>参考値</span>
            </div>
          </div>
        </div>

        <section class="chart-box">
          <h2>高さの推移<small>直近10分</small></h2>
          <canvas id="chart" role="img" aria-label="GPS の高さの推移"></canvas>
          <p class="chart-empty" id="chartEmpty">測り始めると、ここに線が出ます</p>
        </section>

        <p class="status" id="status" role="status">準備しています…</p>
        <p class="note">
          標高は約 90m
          の網目の地図データの地面の高さで、建物の階や細かな起伏は出ません。基準からの差は GPS
          の高さ同士の差です。位置は標高を調べるために約 100m に丸めて Open-Meteo
          に送り、保存しません。標高データ: Copernicus DEM GLO-90(Open-Meteo)。
        </p>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./altimeter-core.js"></script>
    <script src="./altimeter.js"></script>
  </body>
</html>
