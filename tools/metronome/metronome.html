<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>メトロノーム | テンポ30〜240・拍子・タップテンポ</title>
    <meta
      name="description"
      content="テンポ30〜240 BPMのメトロノームです。拍子の切り替え、1拍目のアクセント、タップでテンポを合わせる機能があります。音はブラウザ内で作ります。"
    />
    <meta property="og:title" content="メトロノーム | テンポ30〜240・拍子・タップテンポ" />
    <meta
      property="og:description"
      content="テンポ30〜240 BPMのメトロノームです。拍子の切り替え、1拍目のアクセント、タップでテンポを合わせる機能があります。音はブラウザ内で作ります。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-metronome.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./metronome.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "メトロノーム",
        "alternateName": ["Metronome", "テンポ", "BPM"],
        "description": "テンポ30〜240 BPMのメトロノームです。拍子の切り替え、1拍目のアクセント、タップでテンポを合わせる機能があります。音はブラウザ内で作ります。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-metronome.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">メトロノーム<span class="en">Metronome</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="beat-dots" id="beatDots"></div>

        <div class="bpm-row">
          <button class="round" id="bpmDown" data-log="テンポ −1">−</button>
          <div class="bpm-display">
            <div class="bpm-num" id="bpmNum">120</div>
            <div class="bpm-label">BPM</div>
          </div>
          <button class="round" id="bpmUp" data-log="テンポ ＋1">+</button>
        </div>

        <input
          type="range"
          id="bpmSlider"
          data-log="テンポ"
          data-log-unit=" BPM"
          min="30"
          max="240"
          value="120"
        />

        <div class="row-controls">
          <button class="pill" id="tapBtn">タップでテンポ</button>
          <select id="beatsSelect" data-log="拍子">
            <option value="2">2拍子</option>
            <option value="3">3拍子</option>
            <option value="4" selected>4拍子</option>
            <option value="6">6拍子</option>
          </select>
        </div>

        <button class="pill primary big" id="startStopBtn">開始</button>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./metronome-core.js"></script>
    <script src="./metronome.js"></script>
  </body>
</html>
