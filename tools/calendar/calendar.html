<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>六曜カレンダー | 大安・仏滅・祝日・月の満ち欠けが分かる暦</title>
    <meta
      name="description"
      content="六曜(大安・仏滅など)・祝日と振替休日・二十四節気・毎日の月の満ち欠けが分かるカレンダーです。一粒万倍日や天赦日も表示し、日付を押すと干支や月齢などの詳しい暦が見られます。"
    />
    <meta property="og:title" content="六曜カレンダー | 大安・仏滅・祝日・月の満ち欠けが分かる暦" />
    <meta
      property="og:description"
      content="六曜(大安・仏滅など)・祝日と振替休日・二十四節気・毎日の月の満ち欠けが分かるカレンダーです。一粒万倍日や天赦日も表示し、日付を押すと干支や月齢などの詳しい暦が見られます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-calendar.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./calendar.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "六曜カレンダー",
        "alternateName": ["Calendar", "六曜カレンダー", "大安カレンダー", "祝日カレンダー"],
        "description": "六曜(大安・仏滅など)・祝日と振替休日・二十四節気・毎日の月の満ち欠けが分かるカレンダーです。一粒万倍日や天赦日も表示し、日付を押すと干支や月齢などの詳しい暦が見られます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-calendar.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">カレンダー<span class="en">Calendar</span></h1>
      <button class="dbg-btn" id="setBtn" aria-label="設定" title="設定">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="nav">
          <button class="round" id="prevBtn" aria-label="前の月">‹</button>
          <div class="title" id="title"></div>
          <button class="round" id="nextBtn" aria-label="次の月">›</button>
          <button class="pill small" id="todayBtn">今日</button>
        </div>
        <div class="grid" data-land-main id="grid" data-log="off"></div>
        <div class="legend">
          <span><i class="mk taian"></i>大安</span><span><i class="mk ichi"></i>一粒万倍日</span
          ><span><i class="mk ten"></i>天赦日</span>
        </div>
        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
    </main>
    <div class="sheet" id="settings" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-head">
          <span id="settingsTitle">設定</span
          ><button class="sheet-close" id="settingsClose" aria-label="設定を閉じる">×</button>
        </div>
        <div class="opts">
          <label class="opt"
            >週の始まり<select id="weekStart" data-log="週の始まり">
              <option value="0">日曜日</option>
              <option value="1">月曜日</option>
            </select></label
          >
          <label class="opt"
            ><input type="checkbox" id="showRokuyo" data-log="六曜の表示" checked />六曜を表示</label
          >
          <label class="opt"
            ><input
              type="checkbox"
              id="showLucky"
              data-log="吉日の表示"
              checked
            />一粒万倍日・天赦日を表示</label
          >
          <label class="opt"
            ><input
              type="checkbox"
              id="showMoon"
              data-log="月の満ち欠けの表示"
              checked
            />月の形(月齢)を毎日表示</label
          >
        </div>
        <p class="note">
          六曜・二十四節気・月の満ち欠けは天文計算で求めています(暦要項の値と、まれに1日ずれる可能性があります)。祝日は2020年以降の祝日法にもとづきます。
        </p>
      </div>
    </div>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./calendar-core.js"></script>
    <script src="./calendar.js"></script>
  </body>
</html>
