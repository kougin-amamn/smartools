<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ボイスメモ | ワンタップで録音して保存</title>
    <meta
      name="description"
      content="ワンタップで録音・停止できるボイスメモです。録音した音声はその場で再生し、ダウンロードして保存できます。録音はサーバーに送らず、端末の中だけで扱います。"
    />
    <meta property="og:title" content="ボイスメモ | ワンタップで録音して保存" />
    <meta
      property="og:description"
      content="ワンタップで録音・停止できるボイスメモです。録音した音声はその場で再生し、ダウンロードして保存できます。録音はサーバーに送らず、端末の中だけで扱います。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-voice-memo.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./voice-memo.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ボイスメモ",
        "alternateName": ["Voice Memo", "録音", "ボイスレコーダー"],
        "description": "ワンタップで録音・停止できるボイスメモです。録音した音声はその場で再生し、ダウンロードして保存できます。録音はサーバーに送らず、端末の中だけで扱います。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-voice-memo.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        ボイスメモ<span class="en">Voice Memo</span>
      </h1>
    </header>
    <main class="content">
      <div class="app">
        <button class="rec-btn" id="recBtn" aria-label="録音開始">
          <span class="dot"></span>
        </button>
        <div class="timer" id="timer">00:00</div>
        <div class="status" id="statusText">タップして録音開始</div>

        <div class="list" id="list"></div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./voice-memo.js"></script>
  </body>
</html>
