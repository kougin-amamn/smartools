<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ペイント | 指で描ける簡単お絵かき</title>
    <meta
      name="description"
      content="指やペンで自由に絵を描けるペイントアプリです。ペン・消しゴム・塗りつぶし、色と太さの選択、元に戻す/やり直し、写真を読み込んで上から描く、PNG保存に対応。描いた絵は端末の外に出ません。"
    />
    <meta property="og:title" content="ペイント | 指で描ける簡単お絵かき" />
    <meta
      property="og:description"
      content="指やペンで自由に絵を描けるペイントアプリです。ペン・消しゴム・塗りつぶし、色と太さの選択、元に戻す/やり直し、写真を読み込んで上から描く、PNG保存に対応。描いた絵は端末の外に出ません。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-paint.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./paint.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ペイント",
        "alternateName": ["Paint", "お絵かき", "お絵描きアプリ", "ドローイング"],
        "description": "指やペンで自由に絵を描けるペイントアプリです。ペン・消しゴム・塗りつぶし、色と太さの選択、元に戻す/やり直し、写真を読み込んで上から描く、PNG保存に対応。描いた絵は端末の外に出ません。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-paint.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">ペイント<span class="en">Paint</span></h1>
    </header>
    <main class="content">
      <div class="app">
        <div class="stage" id="stage">
          <canvas id="cv" aria-label="描く場所"></canvas>
        </div>
        <div class="bar">
          <div class="row" role="group" aria-label="道具" data-log-group="道具">
            <button class="pill primary" type="button" id="toolPen" data-tool="pen" aria-pressed="true">
              ペン
            </button>
            <button class="pill" type="button" id="toolEraser" data-tool="eraser" aria-pressed="false">
              消しゴム
            </button>
            <button class="pill" type="button" id="toolFill" data-tool="fill" aria-pressed="false">
              塗りつぶし
            </button>
          </div>
          <div class="row" id="swatches">
            <input type="color" id="color" aria-label="色" value="#222222" />
          </div>
          <div class="row">
            <label class="size" for="size">太さ</label>
            <input type="range" id="size" min="1" max="60" value="8" />
            <span class="size-val" id="sizeVal">8px</span>
          </div>
          <div class="row">
            <button class="pill icon" type="button" id="undo" aria-label="元に戻す" disabled>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 14L4 9l5-5" />
                <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
              </svg>
            </button>
            <button class="pill icon" type="button" id="redo" aria-label="やり直す" disabled>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 14l5-5-5-5" />
                <path d="M20 9H10a6 6 0 0 0 0 12h3" />
              </svg>
            </button>
            <button class="pill" type="button" id="clear">全消し</button>
            <button class="pill" type="button" id="open">画像を開く</button>
            <button class="pill primary" type="button" id="save">PNG保存</button>
            <input type="file" id="file" accept="image/*" aria-label="画像を開く" hidden />
          </div>
          <p class="status" id="status"></p>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./paint-core.js"></script>
    <script src="./paint.js"></script>
  </body>
</html>
