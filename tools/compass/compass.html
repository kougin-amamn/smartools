<!doctype html>
<html lang="ja" class="bar-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>方位磁石 | スマホのセンサーで方角を表示</title>
    <meta
      name="description"
      content="スマホの向きセンサーで、今向いている方角と角度を計器のような文字盤で表示する方位磁石です。15°刻みの目盛りと細い針、読みやすい方角と角度で表示します。磁石の影響や端末によって誤差が出ることがあります。"
    />
    <meta property="og:title" content="方位磁石 | スマホのセンサーで方角を表示" />
    <meta
      property="og:description"
      content="スマホの向きセンサーで、今向いている方角と角度を計器のような文字盤で表示する方位磁石です。15°刻みの目盛りと細い針、読みやすい方角と角度で表示します。磁石の影響や端末によって誤差が出ることがあります。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-compass.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./compass.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "方位磁石",
        "alternateName": ["Compass", "コンパス", "方位"],
        "description": "スマホの向きセンサーで、今向いている方角と角度を計器のような文字盤で表示する方位磁石です。15°刻みの目盛りと細い針、読みやすい方角と角度で表示します。磁石の影響や端末によって誤差が出ることがあります。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-compass.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">方位磁石</h1>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <svg
          class="compass"
          data-land-main="fill"
          id="compass"
          viewBox="-160 -160 320 320"
          role="img"
          aria-label="方位の文字盤"
        >
          <g id="dial"></g>
          <path class="lubber" d="M0 -153 V-140" />
        </svg>
        <div class="readout" aria-label="現在の方位">
          <div class="direction" id="dirLabel">—</div>
          <div class="degree"><span id="headingText">—</span><span class="degree-unit">°</span></div>
        </div>
        <div class="controls">
          <div class="status" id="statusText" role="status">方位を取得しています…</div>
          <div class="start-slot" id="permissionControls" hidden>
            <button class="pill primary" id="startBtn" type="button">センサーを許可</button>
          </div>
          <details class="compass-help">
            <summary>使い方・測定について</summary>
            <p>画面の上が、今向いている方向です。色の付いた針と「北」が北の方向を示します。</p>
            <p>端末を水平に持ってください。方位が不安定な時は、磁石・金属・電化製品から離れ、端末を8の字にゆっくり動かしてください。</p>
            <p>方位の基準や精度は端末・ブラウザによって異なります。相対方位のみの場合は北の方向を特定できません。磁北と地図の北には地域によるずれがあります。</p>
          </details>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.ToolKit && window.ToolKit.media) ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./compass-core.js"></script>
    <script src="./compass.js"></script>
  </body>
</html>
