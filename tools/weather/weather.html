<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>天気予報 | 開くだけで現在地の今日と1週間の天気</title>
    <meta
      name="description"
      content="開くと現在地の天気を自動で表示します。地名検索にも対応し、今の天気・気温・体感温度・湿度・風速と、1週間の天気予報(最高・最低気温、降水確率)を表示します。天気データは Open-Meteo の無料APIを利用しています。"
    />
    <meta property="og:title" content="天気予報 | 開くだけで現在地の今日と1週間の天気" />
    <meta
      property="og:description"
      content="開くと現在地の天気を自動で表示します。地名検索にも対応し、今の天気・気温・体感温度・湿度・風速と、1週間の天気予報(最高・最低気温、降水確率)を表示します。天気データは Open-Meteo の無料APIを利用しています。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-weather.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./weather.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "天気予報",
        "alternateName": ["Weather", "天気", "週間天気"],
        "description": "開くと現在地の天気を自動で表示します。地名検索にも対応し、今の天気・気温・体感温度・湿度・風速と、1週間の天気予報(最高・最低気温、降水確率)を表示します。天気データは Open-Meteo の無料APIを利用しています。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-weather.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">天気予報</h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <div class="search-row">
          <input type="text" id="cityInput" placeholder="地名で検索(例:大阪)" />
          <button class="pill small" id="searchBtn">検索</button>
        </div>
        <div class="search-results" id="searchResults" hidden></div>
        <button class="pill small ghost" id="useLocationBtn">現在地から取得</button>

        <div class="current-card" id="currentCard" hidden>
          <div class="place-name" id="placeName"></div>
          <div class="current-main">
            <div class="current-icon" id="currentIcon"></div>
            <div class="current-temp" id="currentTemp"></div>
          </div>
          <div class="current-desc" id="currentDesc"></div>
          <div class="current-sub" id="currentSub"></div>
        </div>

        <div class="daily-list" id="dailyList"></div>
        <div class="status" id="statusText">現在地を取得中…</div>
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./weather.js"></script>
  </body>
</html>
