<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>回線速度テスト | Ping・ダウンロード・アップロード</title>
    <meta
      name="description"
      content="Ping(応答速度)・ジッター・ダウンロード速度・アップロード速度を計測するネットワークスピードテストです。計測には Cloudflare の速度測定用サーバーを使います。"
    />
    <meta property="og:title" content="回線速度テスト | Ping・ダウンロード・アップロード" />
    <meta
      property="og:description"
      content="Ping(応答速度)・ジッター・ダウンロード速度・アップロード速度を計測するネットワークスピードテストです。計測には Cloudflare の速度測定用サーバーを使います。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-speed-test.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./speed-test.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "回線速度テスト",
        "alternateName": ["Speed Test", "スピードテスト", "回線速度"],
        "description": "Ping(応答速度)・ジッター・ダウンロード速度・アップロード速度を計測するネットワークスピードテストです。計測には Cloudflare の速度測定用サーバーを使います。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-speed-test.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">回線速度テスト<span class="en">Speed Test</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app" data-land="split">
        <div class="gauge-wrap" data-land-main>
          <div class="gauge-val" id="gaugeVal">-</div>
          <div class="gauge-unit" id="gaugeUnit">Mbps</div>
          <div class="gauge-phase" id="gaugePhase">タップして計測開始</div>
        </div>

        <button class="pill primary" id="startBtn">計測開始</button>

        <div class="results">
          <div class="result-box"><span class="label">Ping</span><span class="val" id="pingVal">-</span></div>
          <div class="result-box">
            <span class="label">ジッター</span><span class="val" id="jitterVal">-</span>
          </div>
          <div class="result-box">
            <span class="label">↓ ダウンロード</span><span class="val" id="downVal">-</span>
          </div>
          <div class="result-box">
            <span class="label">↑ アップロード</span><span class="val" id="upVal">-</span>
          </div>
        </div>

        <p class="note">
          計測には<a href="https://speed.cloudflare.com/" target="_blank" rel="noopener"
            >Cloudflareの公開スピードテスト用エンドポイント</a
          >を利用しています(外部サイトからの利用を想定して公開されているものです)。結果はお使いの端末・Wi-Fi/回線状況・Cloudflareとの経路によって変動します。<br />
          ダウンロードは25MB、アップロードは10MBのダミーデータを転送して計測します。通信量がかかりますのでご注意ください。
        </p>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/log.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./speed-test-core.js"></script>
    <script src="./speed-test.js"></script>
  </body>
</html>
