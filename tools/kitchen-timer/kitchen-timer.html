<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>キッチンタイマー | ボタンで時間を合わせてアラーム</title>
    <meta
      name="description"
      content="分・秒のボタンで時間を合わせて使うキッチンタイマーです。残り時間を円で表示し、時間になるとアラーム音と振動で知らせます。"
    />
    <meta property="og:title" content="キッチンタイマー | ボタンで時間を合わせてアラーム" />
    <meta
      property="og:description"
      content="分・秒のボタンで時間を合わせて使うキッチンタイマーです。残り時間を円で表示し、時間になるとアラーム音と振動で知らせます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-kitchen-timer.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./kitchen-timer.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "キッチンタイマー",
        "alternateName": ["Kitchen Timer", "タイマー", "カウントダウン"],
        "description": "分・秒のボタンで時間を合わせて使うキッチンタイマーです。残り時間を円で表示し、時間になるとアラーム音と振動で知らせます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-kitchen-timer.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">キッチンタイマー<span class="en">Kitchen Timer</span></h1>
    </header>
    <main class="content">
      <div class="app" data-land="split" role="group" aria-label="キッチンタイマー">
        <div class="ring-wrap" data-land-main="fill">
          <svg viewBox="0 0 220 220" class="ring">
            <circle class="track" cx="110" cy="110" r="96"></circle>
            <circle
              class="progress"
              id="progressCircle"
              cx="110"
              cy="110"
              r="96"
              transform="rotate(-90 110 110)"
            ></circle>
          </svg>
          <div class="time-display">
            <div class="time" id="timeText">03:00</div>
            <div class="state" id="stateText">セット中</div>
          </div>
        </div>

        <div class="adjust-row" id="adjustRow">
          <button data-adjust="-60">−1分</button>
          <button data-adjust="-10">−10秒</button>
          <button data-adjust="10">+10秒</button>
          <button data-adjust="60">+1分</button>
        </div>

        <div class="controls">
          <button class="icon-btn secondary" id="resetBtn" aria-label="リセット">
            <svg
              class="ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" />
            </svg>
          </button>

          <button class="icon-btn primary" id="startPauseBtn" aria-label="開始">
            <svg
              class="ico"
              id="playIcon"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 4.5v15l12-7.5z" />
            </svg>
            <svg
              class="ico"
              id="pauseIcon"
              style="display: none"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          </button>

          <button class="icon-btn secondary" id="stopBtn" data-log="アラーム停止" aria-label="停止" disabled>
            <svg
              class="ico"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./kitchen-timer-core.js"></script>
    <script src="./kitchen-timer.js"></script>
  </body>
</html>
