<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>音声読み上げ | 入力した文章を声で読み上げ</title>
    <meta
      name="description"
      content="入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。"
    />
    <meta property="og:title" content="音声読み上げ | 入力した文章を声で読み上げ" />
    <meta
      property="og:description"
      content="入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-text-to-speech.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./text-to-speech.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "音声読み上げ",
        "alternateName": ["Text to Speech", "読み上げ", "TTS"],
        "description": "入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-text-to-speech.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">音声読み上げ</h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="app">
        <textarea id="textInput" rows="8" placeholder="読み上げたい文章を入力してください"></textarea>

        <div class="row">
          <span>言語</span>
          <select id="langSelect" data-log="言語">
            <option value="ja-JP" selected>日本語</option>
            <option value="en-US">英語</option>
          </select>
        </div>
        <div class="row">
          <span>速さ</span>
          <input
            type="range"
            id="rateSlider"
            data-log="速さ"
            data-log-value="#rateLabel"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
          <span id="rateLabel">1.0x</span>
        </div>
        <div class="row">
          <span>声の高さ</span>
          <input
            type="range"
            id="pitchSlider"
            data-log="高さ"
            data-log-value="#pitchLabel"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
          <span id="pitchLabel">1.0</span>
        </div>

        <div class="controls">
          <button class="pill" id="stopBtn">■ 停止</button>
          <button class="pill primary" id="playBtn">▶ 読み上げる</button>
        </div>
        <div class="status" id="statusText"></div>
      </div>
    </main>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      (window.log && window.ToolKit) ||
        (function () {
          var miss = [window.log ? '' : 'common/site.js', window.ToolKit ? '' : 'common/tool-kit.js']
            .filter(Boolean)
            .join('、');
          var m =
            '共通ファイル(' +
            miss +
            ')を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          var no = function () {
            return Promise.resolve(false);
          };
          if (!window.log) window.log = f;
          if (!window.log.step)
            window.log.step = function (n, fn) {
              return Promise.resolve()
                .then(fn)
                .then(
                  function (v) {
                    return { ok: true, value: v };
                  },
                  function (e) {
                    return { ok: false, error: e };
                  }
                );
            };
          if (!window.ToolKit)
            window.ToolKit = {
              vibrate: f,
              esc: String,
              copyText: no,
              media: {
                open: function () {
                  return Promise.resolve({ stream: null, message: m });
                },
                stop: f,
                size: f,
                torch: function () {
                  return Promise.resolve({ ok: false, message: m });
                },
              },
              sensor: { permit: no, watchData: f },
            };
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./text-to-speech.js"></script>
  </body>
</html>
