<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>音声読み上げ | 入力した文章を声で読み上げ</title>
    <meta
      name="description"
      content="入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。"
    />
    <meta property="og:title" content="音声読み上げ | 入力した文章を声で読み上げ" />
    <meta
      property="og:description"
      content="入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-text-to-speech.svg" />
    <link rel="stylesheet" href="../../common/site.css" />
    <link rel="stylesheet" href="../../common/tool.css" />
    <link rel="stylesheet" href="./text-to-speech.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "音声読み上げ",
        "alternateName": ["Text to Speech", "読み上げ", "TTS"],
        "description": "入力した文章を、端末の音声で読み上げるツールです。言語・速さ・高さを変えられます。使える声は端末とブラウザによって異なります。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-text-to-speech.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">音声読み上げ<span class="en">Text to Speech</span></h1>
    </header>
    <main class="content">
      <div class="app">
        <textarea id="textInput" rows="8" placeholder="読み上げたい文章を入力してください"></textarea>

        <div class="row">
          <span>言語</span>
          <select id="langSelect" data-log="言語">
            <option value="ja-JP" selected>日本語</option>
            <option value="en-US">英語</option>
          </select>
        </div>
        <div class="row">
          <span>速さ</span>
          <input type="range" id="rateSlider" data-log="速さ" min="0.5" max="2" step="0.1" value="1" />
          <span id="rateLabel">1.0x</span>
        </div>
        <div class="row">
          <span>声の高さ</span>
          <input type="range" id="pitchSlider" data-log="高さ" min="0.5" max="2" step="0.1" value="1" />
          <span id="pitchLabel">1.0</span>
        </div>

        <div class="controls">
          <button class="pill" id="stopBtn">■ 停止</button>
          <button class="pill primary" id="playBtn">▶ 読み上げる</button>
        </div>
        <div class="status" id="statusText"></div>
      </div>
    </main>
    <script src="../../common/log.js"></script>
    <script src="../../common/autolog.js"></script>
    <script src="../../common/env.js"></script>
    <script src="../../common/site.js"></script>
    <script src="../../common/tool-kit.js"></script>
    <script>
      window.ToolKit ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>'
        );
    </script>
    <script src="./text-to-speech.js"></script>
  </body>
</html>
