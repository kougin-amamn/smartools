<!doctype html>
<html lang="ja" class="bar-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>3D本棚ランチャー | 書斎の本棚からツールを開くアプリランチャー</title>
    <meta
      name="description"
      content="ツールを開くアプリランチャーです。家の書斎の木の本棚に、ツールが一冊ずつ本になって並び、机の上にはよく使うツールが置かれます。ドラッグで見回し、ピンチやホイールで拡大、本をタップすると棚から引き出して表紙と説明を見せ、もう一度タップでツールを開けます。"
    />
    <meta
      property="og:title"
      content="3D本棚ランチャー | 書斎の本棚からツールを開くアプリランチャー"
    />
    <meta
      property="og:description"
      content="ツールを開くアプリランチャーです。家の書斎の木の本棚に、ツールが一冊ずつ本になって並び、机の上にはよく使うツールが置かれます。ドラッグで見回し、ピンチやホイールで拡大、本をタップすると棚から引き出して表紙と説明を見せ、もう一度タップでツールを開けます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./app-icon-launcher-3d-bookshelf.svg"
    />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="../common/site.css" />
    <link rel="stylesheet" href="./launcher.css" />
    <link rel="stylesheet" href="./launcher-3d-bookshelf.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "3D本棚ランチャー",
        "alternateName": [
          "3D Bookshelf Launcher",
          "本棚ランチャー",
          "アプリランチャー",
          "書斎ランチャー"
        ],
        "description": "ツールを開くアプリランチャーです。家の書斎の木の本棚に、ツールが一冊ずつ本になって並び、机の上にはよく使うツールが置かれます。ドラッグで見回し、ピンチやホイールで拡大、本をタップすると棚から引き出して表紙と説明を見せ、もう一度タップでツールを開けます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-launcher-3d-bookshelf.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        3D本棚ランチャー<span class="en">3D Bookshelf Launcher</span>
      </h1>
    </header>
    <main class="content">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="3D本棚ランチャーの本棚"></canvas>
      </div>
      <div class="hint" id="hint">
        <span>ドラッグで見回す ／</span> <span>ピンチ・ホイールで拡大 ／</span>
        <span>本をタップで引き出す ／</span> <span>もう一度タップで開く</span>
      </div>

      <div class="card" id="card" hidden>
        <div class="card-head">
          <button
            class="nav-btn"
            id="prevBtn"
            aria-label="前の本"
            title="前の本"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <div class="card-no" id="cardNo"></div>
          <button
            class="nav-btn"
            id="nextBtn"
            aria-label="次の本"
            title="次の本"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
        <div class="card-title" id="cardTitle"></div>
        <div class="card-desc" id="cardDesc"></div>
        <div class="card-tags" id="cardTags"></div>
        <div class="card-actions">
          <button class="pill primary" id="openBtn">このツールを開く</button>
        </div>
      </div>

      <div class="bar" id="bar">
        <button class="pill small" id="zoomBtn" hidden>等倍に戻す</button>
        <button class="pill small" id="homeBtn" hidden>本棚に戻す</button>
        <button class="pill small" id="listBtn">一覧</button>
      </div>

      <section class="list-panel" id="listPanel" data-log-group="一覧" hidden>
        <div class="list-head">
          <div class="list-title" id="listTitle">ツール一覧</div>
          <button class="pill small" id="listClose">閉じる</button>
        </div>
        <p class="list-note" id="listNote" hidden></p>
        <ul class="list" id="list"></ul>
      </section>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <div class="ld-box">
          <div class="ld-title">3D本棚ランチャーを準備しています</div>
          <div class="ld-bar"><i id="ldBar" style="width: 5%"></i></div>
          <div class="ld-step" id="ldStep">3D表示の部品を読み込んでいます…</div>
        </div>
      </div>
    </main>
    <script src="../common/log.js"></script>
    <script src="../common/autolog.js"></script>
    <script src="../common/env.js"></script>
    <script src="../common/site.js"></script>
    <script>
      window.log ||
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./launcher-common.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      /* 入口: 自分のファイルが1つでも読めなければ、読み込み中の表示に理由を出す(three.js が読めない時は 2D の一覧) */
      import("./launcher-3d-bookshelf.js").catch(function (e) {
        if (window.Launcher) Launcher.showModuleError(e);
        else
          log.error(
            "ランチャーの共通ファイル(launcher-common.js)を読み込めませんでした",
            e,
          );
      });
    </script>
  </body>
</html>
