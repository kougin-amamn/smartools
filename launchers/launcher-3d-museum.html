<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3Dミュージアムランチャー | 美術館の絵画からツールを開くアプリランチャー</title>
    <meta
      name="description"
      content="ツールを開くアプリランチャーです。ホワイトキューブの美術館に、ツールが一枚ずつ絵画として飾られます。カテゴリごとの展示室、新着とよく使うの壁があり、絵画をタップで正面へ、もう一度タップでツールを開けます。"
    />
    <meta
      property="og:title"
      content="3Dミュージアムランチャー | 美術館の絵画からツールを開くアプリランチャー"
    />
    <meta
      property="og:description"
      content="ツールを開くアプリランチャーです。ホワイトキューブの美術館に、ツールが一枚ずつ絵画として飾られます。カテゴリごとの展示室、新着とよく使うの壁があり、絵画をタップで正面へ、もう一度タップでツールを開けます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-launcher-3d-museum.svg" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="../common/site.css" />
    <link rel="stylesheet" href="./launcher.css" />
    <link rel="stylesheet" href="./launcher-3d-museum.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "3Dミュージアムランチャー",
        "alternateName": [
          "3D Museum Launcher",
          "ミュージアムランチャー",
          "美術館ランチャー",
          "アプリランチャー"
        ],
        "description": "ツールを開くアプリランチャーです。ホワイトキューブの美術館に、ツールが一枚ずつ絵画として飾られます。カテゴリごとの展示室、新着とよく使うの壁があり、絵画をタップで正面へ、もう一度タップでツールを開けます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-launcher-3d-museum.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">
        3Dミュージアムランチャー<span class="en">3D Museum Launcher</span>
      </h1>
    </header>
    <main class="content">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="3Dミュージアムの部屋"></canvas>
        <div class="hint" id="hint">
          <span>ドラッグで見回す</span> ／ <span>ピンチ・ホイールで拡大</span> ／
          <span>絵画をタップで近づく</span> ／ <span>入口をタップで移動</span>
        </div>

        <div class="room-name" id="roomName" hidden></div>
        <div class="fade" id="fade"></div>

        <div class="card" id="card" hidden>
          <div class="card-head">
            <button class="nav-btn" id="prevBtn" aria-label="前の作品" title="前の作品" hidden>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 5l-7 7 7 7" />
              </svg>
            </button>
            <div class="card-no" id="cardNo"></div>
            <button class="nav-btn" id="nextBtn" aria-label="次の作品" title="次の作品" hidden>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <div class="card-title" id="cardTitle"></div>
          <div class="card-desc" id="cardDesc"></div>
          <div class="card-tags" id="cardTags"></div>
          <div class="card-actions">
            <button class="pill primary" id="openBtn">このツールを開く</button>
          </div>
        </div>

        <div class="bar" id="bar">
          <button class="pill small" id="zoomBtn" hidden>等倍に戻す</button>
          <button class="pill small" id="homeBtn" hidden>全体に戻る</button>
          <button class="pill small" id="hallBtn" hidden>ホールへ</button>
          <button class="pill small" id="listBtn">一覧</button>
        </div>

        <section class="list-panel" id="listPanel" data-log-group="一覧" hidden>
          <div class="list-head">
            <div class="list-title" id="listTitle">ツール一覧</div>
            <button class="pill small" id="listClose">閉じる</button>
          </div>
          <p class="list-note" id="listNote" hidden></p>
          <ul class="list" id="list"></ul>
        </section>
      </div>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <div class="ld-box">
          <div class="ld-title">3Dミュージアムランチャーを準備しています</div>
          <div class="ld-bar"><i id="ldBar" style="width: 5%"></i></div>
          <div class="ld-step" id="ldStep">3D表示の部品を読み込んでいます…</div>
        </div>
      </div>
    </main>
    <script src="../common/log.js"></script>
    <script src="../common/autolog.js"></script>
    <script src="../common/env.js"></script>
    <script src="../common/site.js"></script>
    <script>
      window.log ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./launcher-common.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
    </script>
    <script type="module">
      /* 入口: 自分のファイルが1つでも読めなければ、読み込み中の表示に理由を出す(three.js が読めない時は 2D の一覧) */
      import('./launcher-3d-museum.js').catch(function (e) {
        if (window.Launcher) Launcher.showModuleError(e);
        else log.error('ランチャーの共通ファイル(launcher-common.js)を読み込めませんでした', e);
      });
    </script>
  </body>
</html>
