<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダッシュボード | 好きなツールを1画面に並べて使う</title>
    <meta
      name="description"
      content="これまでに作ったツールを1つの画面にタイルで並べて、そのまま使えるダッシュボードです。時計・天気・ポモドーロ・メモなどを選んで並べ、順番と大きさを変えられます。配置は端末に保存されます。"
    />
    <meta property="og:title" content="ダッシュボード | 好きなツールを1画面に並べて使う" />
    <meta
      property="og:description"
      content="これまでに作ったツールを1つの画面にタイルで並べて、そのまま使えるダッシュボードです。時計・天気・ポモドーロ・メモなどを選んで並べ、順番と大きさを変えられます。配置は端末に保存されます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="../og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./app-icon-dashboard.svg" />
    <link rel="stylesheet" href="../common/site.css" />
    <link rel="stylesheet" href="./dashboard.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ダッシュボード",
        "alternateName": ["Dashboard", "ツールまとめ表示", "ウィジェット"],
        "description": "これまでに作ったツールを1つの画面にタイルで並べて、そのまま使えるダッシュボードです。時計・天気・ポモドーロ・メモなどを選んで並べ、順番と大きさを変えられます。配置は端末に保存されます。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Webブラウザ)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./app-icon-dashboard.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">ダッシュボード<span class="en">Dashboard</span></h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <div class="toolbar">
        <button class="pill" id="editBtn" aria-pressed="false">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 20h4L19 9l-4-4L4 16z" />
            <path d="M13.5 6.5l4 4" />
          </svg>
          <span id="editLabel">並べ替え・追加</span>
        </button>
        <div class="edit-tools" id="editTools" hidden>
          <select id="addSel" aria-label="追加するツール"></select>
          <button class="pill primary" id="addBtn">追加</button>
          <button class="pill" id="resetBtn">初期に戻す</button>
        </div>
      </div>
      <div class="msg" id="msg" hidden></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </main>
    <script src="../common/site.js"></script>
    <script>
      window.log ||
        (function () {
          var m =
            '共通ファイル(common/site.js)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          window.log = f;
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent = m;
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./launcher-common.js"></script>
    <script src="./dashboard-core.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
