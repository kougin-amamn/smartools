<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>smartools | ブラウザで使える無料ツール集</title>
    <meta
      name="description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:title" content="smartools | ブラウザで使える無料ツール集" />
    <meta
      property="og:description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="./og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon-home.svg" />
    <link rel="stylesheet" href="./common/site.css" />
    <link rel="stylesheet" href="./index.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "smartools",
        "alternateName": ["スマートツール", "無料Webツール集"],
        "description": "電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。",
        "inLanguage": "ja"
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./icons/app-icon-home.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">smartools</h1>
    </header>
    <main class="content">
      <p class="lead">ブラウザだけで使える小さなツール集です。インストールは不要です。</p>
      <nav class="views" id="views" aria-label="表示の切り替え" hidden>
        <span class="views-label">表示</span>
        <a class="view" aria-current="page" href="./index.html">一覧</a>
      </nav>
      <nav class="views" id="sorts" aria-label="並び" hidden>
        <span class="views-label">並び</span>
        <button type="button" class="view" data-sort="category" data-log="分類">分類</button>
        <button type="button" class="view" data-sort="recent" data-log="最近">最近</button>
        <button type="button" class="view" data-sort="frequent" data-log="よく使う">
          よく使う
        </button>
        <button type="button" class="view" data-sort="name" data-log="名前">名前</button>
      </nav>
      <p class="status" id="status" role="status">ツールの一覧を読み込んでいます…</p>
      <div id="list"></div>
    </main>
    <script src="./common/log.js"></script>
    <script src="./common/env.js"></script>
    <script src="./common/site.js"></script>
    <script src="./common/tool-usage.js"></script>
    <script>
      window.log ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./index.js"></script>
  </body>
</html>
