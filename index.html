<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>smartools | ブラウザで使える無料ツール集</title>
    <meta
      name="description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:title" content="smartools | ブラウザで使える無料ツール集" />
    <meta
      property="og:description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="./og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon-home.svg" />
    <link rel="stylesheet" href="./common/site.css" />
    <link rel="stylesheet" href="./index.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "smartools",
        "alternateName": ["スマートツール", "無料Webツール集"],
        "description": "電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。",
        "inLanguage": "ja"
      }
    </script>
  </head>
  <body>
    <header class="site-bar" data-language-switch>
      <img src="./icons/app-icon-home.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">smartools</h1>
    </header>
    <main class="content">
      <p class="lead" data-i18n="site.tagline">
        ブラウザだけで使えるツール集です。インストールは不要です。
      </p>
      <div class="list-bar">
        <label class="choice" id="views" hidden>
          <span data-i18n="list.view">表示</span>
          <select id="viewSelect" aria-label="表示の切り替え" data-i18n-label="list.viewSwitch">
            <option value="./index.html" selected data-i18n="list.viewList">一覧</option>
          </select>
        </label>
        <label class="choice" id="sorts" hidden>
          <span data-i18n="list.sort">並び順</span>
          <select id="sortSelect" data-log="並び順">
            <option value="category" data-i18n="list.sortCategory">分類</option>
            <option value="recent" data-i18n="list.sortRecent">最近</option>
            <option value="frequent" data-i18n="list.sortFrequent">よく使う</option>
            <option value="name" data-i18n="list.sortName">名前</option>
          </select>
        </label>
      </div>
      <p class="status" id="status" role="status" data-i18n="list.loading">
        ツールの一覧を読み込んでいます…
      </p>
      <div id="list"></div>
    </main>
    <script src="./common/log.js"></script>
    <script src="./common/env.js"></script>
    <script src="./common/site.js"></script>
    <script src="./common/tool-usage.js"></script>
    <script>
      window.log ||
        document.body.insertAdjacentHTML(
          'afterbegin',
          '<p style="margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif">共通ファイル(common/)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。</p>',
        );
    </script>
    <script src="./index.js"></script>
  </body>
</html>
