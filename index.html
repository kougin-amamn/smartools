<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>smartools | ブラウザで使える無料ツール集</title>
    <meta
      name="description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:title" content="smartools | ブラウザで使える無料ツール集" />
    <meta
      property="og:description"
      content="電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="./og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon-home.svg" />
    <link rel="stylesheet" href="./common/site.css" />
    <link rel="stylesheet" href="./index.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "smartools",
        "alternateName": ["スマートツール", "無料Webツール集"],
        "description": "電卓やタイマー、時計、カメラ、QRコード、センサー表示など、ブラウザだけで使える小さなツールを集めたサイトです。インストール不要・無料で、スマホでもパソコンでも使えます。",
        "inLanguage": "ja"
      }
    </script>
  </head>
  <body>
    <header class="site-bar">
      <img src="./icons/app-icon-home.svg" alt="" />
      <h1 style="margin: 0; font: inherit; flex: 1">smartools</h1>
      <button class="dbg-btn" id="themeBtn" aria-label="テーマ切り替え" title="テーマ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></svg>
      </button>
      <button class="dbg-btn" id="dbgBtn" aria-label="デバッグ表示の切り替え" title="デバッグ">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 8h8v8a4 4 0 0 1-8 0zM9 3l1.5 2M15 3l-1.5 2M4 12h4M16 12h4M5 19l3-2M19 19l-3-2" />
        </svg>
      </button>
    </header>
    <main class="content">
      <p class="lead">ブラウザだけで使える小さなツール集です。インストールは不要です。</p>
      <nav class="views" id="views" aria-label="表示の切り替え" hidden>
        <span class="views-label">表示</span>
        <a class="view" aria-current="page" href="./index.html">一覧</a>
      </nav>
      <p class="status" id="status" role="status">ツールの一覧を読み込んでいます…</p>
      <div id="list"></div>
    </main>
    <script src="./common/log.js"></script>
    <script src="./common/env.js"></script>
    <script src="./common/site.js"></script>
    <script>
      window.log ||
        (function () {
          var f = function () {};
          f.info = f.debug = f.warn = f.error = f;
          window.log = f;
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('p');
            d.textContent =
              '共通ファイル(common/log.js)を読み込めませんでした。https で配信したページ(または http://127.0.0.1 のローカルサーバー)で開いてください。';
            d.style.cssText =
              'margin:16px;padding:12px 14px;border-radius:12px;background:#fdecec;color:#c93a3a;font:14px/1.6 sans-serif';
            document.body.insertBefore(d, document.body.firstChild);
          });
        })();
    </script>
    <script src="./index.js"></script>
  </body>
</html>
